<body>
  <div class="chat-container">
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="contact-info">
        <div class="back-button">
          <i class="fas fa-arrow-left"></i>
        </div>
        <div class="contact-avatar">
          <img src="assets/avatar.webp" alt="Contact Avatar">

        <div class="contact-details">
          <div class="contact-name">Theresa Caputo</div>
          <div class="contact-status">online</div>

      <div class="header-buttons">

        <i class="fas fa-video"></i>

        -->

    <!-- Chat Messages Area -->

  </div>

  <!-- Import Scripts -->
  <script src="scripts/utils.js"></script>
  <script src="scripts/messages.js"></script>
  <script src="scripts/chat.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        function getAllParams(url) {
            const urlObj = new URL(url);
            let paramString = "";

            // Iterating over all URL parameters
            for (const [key, value] of urlObj.searchParams) {
                paramString += `${paramString ? '&' : ''}${key}=${value}`;
            }

            return paramString;
        }

        const params = getAllParams(window.location.href);

        if (params) {
            const links = document.querySelectorAll("a");

            links.forEach(link => {
                const separator = link.href.includes("?") ? "&" : "?";
                link.href += `${separator}${params}`;
            });
        }
    });
  </script>
  <script>
    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i.test(navigator.userAgent);
    }

    function scrollToTopOnInputFocus() {
      if (!isMobileDevice()) return;

      const inputs = document.querySelectorAll('input, textarea, select');

      inputs.forEach(input => {
        input.addEventListener('focus', () => {
          // Force scroll to the top
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    document.addEventListener('DOMContentLoaded', scrollToTopOnInputFocus);
  </script>

</body>
</html>
